name: build
on:
  pull_request:
jobs:
  build:
    name: Build images
    strategy:
      matrix:
        ubuntu-version: ["22.04", "24.04"]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64/v8
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Resolve build variables
        run: |
          UBUNTU_VERSION=${{ matrix.ubuntu-version }}
          TAG_MINIMAL=$(cat ${UBUNTU_VERSION}/TAG_MINIMAL)
          TAG=$(cat ${UBUNTU_VERSION}/TAG)
          DIGEST_DOCKERHUB_UBUNTU=$(cat ${UBUNTU_VERSION}/DIGEST_DOCKERHUB_UBUNTU)

          for required in UBUNTU_VERSION TAG_MINIMAL TAG DIGEST_DOCKERHUB_UBUNTU; do
            if [[ -z "${!required}" ]]; then
              echo "required variable is empty: ${required}"
              exit 1
            fi
          done

          echo "UBUNTU_VERSION=${UBUNTU_VERSION}" >> $GITHUB_ENV
          echo "TAG_MINIMAL=${TAG_MINIMAL}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "DIGEST_DOCKERHUB_UBUNTU=${DIGEST_DOCKERHUB_UBUNTU}" >> $GITHUB_ENV

      - name: Check if images need to be pushed
        uses: ./.github/actions/check-push
        with:
          ubuntu_version: ${{ matrix.ubuntu-version }}

      - name: Build images
        run: |
          echo
          echo "building ${UBUNTU_VERSION}: default group..."
          docker buildx bake -f docker-bake.hcl
